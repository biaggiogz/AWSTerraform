[package]
name = "excel-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.6.3"
aws-sdk-s3 = "1.82.0"
aws_lambda_events = { version = "0.16.0", default-features = false, features = ["eventbridge"] }
lambda_runtime = "0.14.1"
polars = { version = "0.44", features = ["lazy", "parquet", "strings"] }
calamine = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
# Candle ML Framework
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
# Model serialization
bincode = "1.3"
# Feature engineering
hashbrown = "0.14"
# Fix rand version conflicts
rand = "0.8.5"